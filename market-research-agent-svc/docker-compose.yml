version: "3.8"

services:
  market-research-agent:
    build: .
    ports:
      - "18021:8021"
    environment:
      MRA_HOST: "0.0.0.0"
      MRA_PORT: "8021"
      MRA_REDIS_URL: "redis://redis:6379/11"
      MRA_KAFKA_BOOTSTRAP_SERVERS: ""
      MRA_ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MRA_TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      MRA_GNEWS_API_KEY: "${GNEWS_API_KEY:-}"
      MRA_LOG_LEVEL: "INFO"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
