# Market Research Agent (MRA) — Skill Registry
# Source: app/skills/*.py SkillMeta definitions
# Default idempotent=true, default timeout_ms=30000 per models.py

skills:
  - skill_id: SKL-MRA-01
    name: web_market_search
    description: "Web search for market data, reports, and news articles"
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: config
        type: object
        required: false
      - field: previous_outputs
        type: object
        required: false
    output_schema:
      - field: query
        type: string
      - field: results
        type: array
        description: "Tavily search results with title, url, content"
      - field: sources
        type: array
        description: "Source references with type, title, url"
    timeout_ms: 30000
    allowed_roles: [OWNER, ADMIN, EDITOR, VIEWER]
    idempotent: true

  - skill_id: SKL-MRA-02
