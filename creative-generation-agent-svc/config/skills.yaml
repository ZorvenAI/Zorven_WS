# creative-generation-agent-svc skill registry
# WF3 Agent 3.2 — AI ad creative generation (images + copy)
# 12 skills (SKL-CGA-01..05, 07..14; SKL-CGA-06 deferred)
# Source: app/logic/ modules + CLAUDE.md skill table

skills:
  # ── Research Phase (SKL-CGA-01..03) ──────────────────────────────────────────
  - skill_id: SKL-CGA-01
    name: creative_context_loader
    description: "Load CAA blueprint + WF1 + WF2 + Company context via parallel HTTP calls"
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: previous_outputs
        type: object
        required: true
      - field: config
        type: object
        required: false
    output_schema:
      - field: caa_blueprint
        type: object
        description: "Campaign blueprint with creative briefs per audience x funnel"
      - field: wf1_context
        type: object
        description: "WF1 APA persona data"
      - field: wf2_context
        type: object
        description: "WF2 strategy context (BPV voice, BPA positioning, NTA name/tagline, BSA story)"
      - field: company_context
        type: object
        description: "Company model (colors, logo, industry)"
    timeout_ms: 30000
    allowed_roles: [OWNER, ADMIN, EDITOR, VIEWER]
    idempotent: true

