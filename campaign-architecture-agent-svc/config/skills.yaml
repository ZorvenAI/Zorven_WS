skills:
  # ── Research Phase (SKL-CAA-01..05) ──────────────────────────────────────────
  - skill_id: SKL-CAA-01
    name: strategy_context_loader
    description: "Load WF1 + WF2 + Company context via parallel HTTP calls to Django analytics endpoints"
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: previous_outputs
        type: object
        required: true
      - field: config
        type: object
        required: false
    output_schema:
      - field: wf1_context
        type: object
        description: "WF1 analytics context (APA + CIA minimum)"
      - field: wf2_context
        type: object
        description: "WF2 strategy context (BPA minimum + BPV + NTA + BSA)"
      - field: company_context
        type: object
        description: "Company model data"
      - field: baa_context
        type: object
        description: "Optional brand architecture context"
    timeout_ms: 30000
    allowed_roles: [OWNER, ADMIN, EDITOR, VIEWER]
    idempotent: true

