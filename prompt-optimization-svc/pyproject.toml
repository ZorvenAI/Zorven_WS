[project]
name = "prompt-optimization-svc"
version = "0.1.0"
description = "MLflow prompt registry + GEPA optimization service for Zorven AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "mlflow-skinny>=2.21.0",
    "anthropic>=0.84.0",
    "redis>=5.0.0",
    "aiokafka>=0.11.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "psycopg2-binary>=2.9.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: integration tests requiring Redis (deselect with '-m not integration')",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
