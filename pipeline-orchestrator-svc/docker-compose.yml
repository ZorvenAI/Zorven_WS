version: "3.8"

services:
  orchestrator:
    build: .
    ports:
      - "8010:8010"
    environment:
      ORCHESTRATOR_SERVICE_TOKEN: ${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      ORCHESTRATOR_CALLBACK_TOKEN: ${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      ORCHESTRATOR_REDIS_URL: redis://redis:6379/1
      ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS: ""
      ORCHESTRATOR_LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orchestrator-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orchestrator-network

networks:
  orchestrator-network:
    driver: bridge
