version: "3.8"
services:
  competitor-intel-agent:
    build: .
    ports:
      - "8022:8022"
    environment:
      - CIA_REDIS_URL=redis://redis:6379/12
      - CIA_HOST=0.0.0.0
      - CIA_PORT=8022
      - CIA_ANTHROPIC_API_KEY=${CIA_ANTHROPIC_API_KEY:-}
      - CIA_TAVILY_API_KEY=${CIA_TAVILY_API_KEY:-}
      - CIA_KAFKA_BOOTSTRAP_SERVERS=${CIA_KAFKA_BOOTSTRAP_SERVERS:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8022/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
