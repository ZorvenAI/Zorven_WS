# Competitor Intelligence Agent (CIA) — Skill Registry
# Source: app/skills/*.py SkillMeta definitions
# Default idempotent=true, default timeout_ms=30000 per models.py

skills:
  - skill_id: SKL-CIA-01
    name: competitor_discovery_search
    description: >-
      Discover competitors via web search. Uses MRA competitive_landscape
      as seed hints when available from upstream pipeline.
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: config
        type: object
        required: false
      - field: previous_outputs
        type: object
        required: false
        description: "previous_outputs.market_research.competitive_landscape seeds discovery"
    output_schema:
      - field: competitors
        type: array
        description: "Discovered competitor names, domains, and descriptions"
      - field: sources
        type: array
    timeout_ms: 45000
    allowed_roles: [OWNER, ADMIN, EDITOR, VIEWER]
    idempotent: true

  - skill_id: SKL-CIA-02
    name: competitor_website_profiler
    description: >-
      Profile competitor websites: homepage messaging, pricing tiers,
