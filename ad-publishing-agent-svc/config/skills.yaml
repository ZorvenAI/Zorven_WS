  - skill_id: SKL-APA33-12
    name: human_escalation
    description: "Escalate publishing failures with rollback context (circuit breaker trips, verification failures)"
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: previous_outputs
