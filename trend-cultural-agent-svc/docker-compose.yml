version: "3.8"

services:
  trend-cultural-agent:
    build: .
    ports:
      - "8024:8024"
    environment:
      - TCIA_REDIS_URL=redis://redis:6379/14
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
