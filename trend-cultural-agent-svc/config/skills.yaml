# Trend & Cultural Insights Agent (TCIA) — Skill Registry
# Source: app/skills/skl_tcia_*.py SkillMeta definitions
# Default idempotent=true, default timeout_ms=30000 per models.py (dataclass)

skills:
  - skill_id: SKL-TCIA-01
    name: social_trend_scanner
    description: "Scan social media platforms for trending topics"
    input_schema:
      - field: input_prompt
        type: string
        required: true
      - field: input_context
        type: object
        required: true
      - field: tenant_context
        type: TenantContext
        required: true
      - field: config
        type: object
        required: false
      - field: previous_outputs
        type: object
        required: false
        description: "previous_outputs.market_research, competitor_intelligence, audience_persona for context"
    output_schema:
      - field: trends
        type: array
        description: "Trending topics with platform, engagement metrics, velocity"
      - field: sources
        type: array
    timeout_ms: 45000
    allowed_roles: [OWNER, ADMIN, EDITOR, VIEWER]
    idempotent: true

