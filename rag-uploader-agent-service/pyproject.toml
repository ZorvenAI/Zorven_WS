[project]
name = "rag-uploader-agent-service"
version = "0.1.0"
description = "RAG Uploader Agent — persists documents to Vertex AI RAG Store"
requires-python = ">=3.12"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (Redis, Kafka)",
]
