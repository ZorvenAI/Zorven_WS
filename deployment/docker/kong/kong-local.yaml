# Kong Gateway Declarative Configuration
# Version: 2.0 - AI Brand Automator with Kong Integration
# 
# This file defines the entire Kong Gateway state in DB-less mode.
# Reference: https://docs.konghq.com/gateway/latest/production/deployment-topologies/db-less-and-declarative-config/

_format_version: "3.0"
_transform: true

# =============================================================================
# SERVICES (Upstream Backends)
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 1. Django Backend API Service
  # ---------------------------------------------------------------------------
  - name: core-api-service
    url: http://host.docker.internal:8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - core
      - backend
    routes:
      # Main API route (protected - requires JWT)
      - name: core-api-route
        paths:
          - /api/v1
        strip_path: false
        preserve_host: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        tags:
          - api
          - protected

  # ---------------------------------------------------------------------------
  # 2. Authentication Routes (Anonymous - No JWT Required)
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://host.docker.internal:8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - auth
      - public
    routes:
      # Login endpoint
      - name: auth-login-route
        paths:
          - /api/v1/auth/login
        strip_path: false
        preserve_host: true
        methods:
          - POST
          - OPTIONS
        tags:
          - auth
          - public
      
      # Register endpoint
      - name: auth-register-route
        paths:
          - /api/v1/auth/register
        strip_path: false
        preserve_host: true
        methods:
          - POST
          - OPTIONS
        tags:
          - auth
          - public
      
      # Token refresh endpoint
      - name: auth-refresh-route
        paths:
          - /api/v1/auth/token/refresh
        strip_path: false
        preserve_host: true
        methods:
          - POST
          - OPTIONS
        tags:
          - auth
          - public

  # ---------------------------------------------------------------------------
  # 3. Health Check Routes (Anonymous)
  # ---------------------------------------------------------------------------
  - name: health-service
    url: http://host.docker.internal:8000
    connect_timeout: 10000
    write_timeout: 10000
    read_timeout: 10000
    retries: 1
    tags:
      - health
      - public
    routes:
      - name: health-routes
        paths:
          - /health
          - /ready
          - /alive
        strip_path: false
        preserve_host: true
        methods:
          - GET
        tags:
          - health
          - public

  # ---------------------------------------------------------------------------
  # 4. Stripe Webhook Route (Anonymous - Verified by Stripe Signature)
  # ---------------------------------------------------------------------------
  - name: webhook-service
    url: http://host.docker.internal:8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 0  # Don't retry webhooks
    tags:
      - webhook
      - public
    routes:
      - name: stripe-webhook-route
        paths:
          - /api/v1/subscriptions/webhook
        strip_path: false
        preserve_host: true
        methods:
          - POST
        tags:
          - webhook
          - stripe

  # ---------------------------------------------------------------------------
  # 5. Google Cloud Storage Direct Upload Service
  # ---------------------------------------------------------------------------
  - name: gcs-storage-service
    url: https://storage.googleapis.com
    connect_timeout: 30000
    write_timeout: 300000  # 5 minutes for large uploads
    read_timeout: 300000   # 5 minutes for large uploads
    retries: 2
    tags:
      - gcs
      - storage
    routes:
      - name: gcs-upload-route
        paths:
          - /ingest/upload
        strip_path: true
        preserve_host: false
        methods:
          - POST
          - PUT
        tags:
          - upload
          - protected

  # ---------------------------------------------------------------------------
  # 6. Event Ingestion Service (Routes to Django, which publishes to Kafka)
  # ---------------------------------------------------------------------------
  # For MVP, events go through Django which uses kafka_service to publish
  - name: event-ingest-service
    url: http://host.docker.internal:8000
    connect_timeout: 5000
    write_timeout: 5000
    read_timeout: 5000
    retries: 1
    tags:
      - events
    routes:
      - name: event-ingest-route
        paths:
          - /api/v1/events/ingest
        strip_path: false
        preserve_host: true
        methods:
          - POST
        tags:
          - events
          - protected

# =============================================================================
# CONSUMERS (JWT Authentication)
# =============================================================================
consumers:
  - username: django-backend
    tags:
      - backend
      - jwt

# JWT Credentials for the Django backend consumer
jwt_secrets:
  - consumer: django-backend
    key: ai-brand-automator  # Issuer claim value
    algorithm: HS256
    # Secret is injected via environment variable KONG_JWT_SECRET
    # In production, use: secret: "${KONG_JWT_SECRET}"
    secret: "${JWT_SECRET_KEY}"

# =============================================================================
# PLUGINS
# =============================================================================
plugins:
  # ---------------------------------------------------------------------------
  # A. GLOBAL CORS Configuration
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
        - https://app.aibrandautomator.com
        - "${CORS_ALLOWED_ORIGINS}"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - X-Requested-With
        - X-CSRF-Token
        - X-Tenant-ID
      exposed_headers:
        - X-Auth-Token
        - X-Request-Id
        - X-Tenant-ID
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - security
      - cors

  # ---------------------------------------------------------------------------
  # B. Global Rate Limiting
  # ---------------------------------------------------------------------------
  - name: rate-limiting
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
      error_code: 429
      error_message: "Rate limit exceeded. Please try again later."
    tags:
      - security
      - rate-limiting

  # ---------------------------------------------------------------------------
  # C. JWT Authentication (Applied to Protected Routes Only)
  # ---------------------------------------------------------------------------
  # JWT for Core API Route
  - name: jwt
    route: core-api-route
    config:
      key_claim_name: iss
      secret_is_base64: false
      claims_to_verify:
        - exp
      run_on_preflight: false
      maximum_expiration: 604800  # 7 days (matches refresh token)
    tags:
      - security
      - jwt

  # JWT for GCS Upload Route
  - name: jwt
    route: gcs-upload-route
    config:
      key_claim_name: iss
      secret_is_base64: false
      claims_to_verify:
        - exp
      run_on_preflight: false
    tags:
      - security
      - jwt

  # JWT for Event Ingestion Route
  - name: jwt
    route: event-ingest-route
    config:
      key_claim_name: iss
      secret_is_base64: false
      claims_to_verify:
        - exp
      run_on_preflight: false
    tags:
      - security
      - jwt

  # ---------------------------------------------------------------------------
  # D. Request Transformer for Core API (Identity Injection)
  # ---------------------------------------------------------------------------
  - name: request-transformer
    route: core-api-route
    config:
      add:
        headers:
          - "X-Kong-Proxy: true"
          - "X-Forwarded-Proto: https"
      remove:
        headers: []
    tags:
      - transform

  # ---------------------------------------------------------------------------
  # E. Request Transformer for GCS Upload (Credential Injection)
  # ---------------------------------------------------------------------------
  - name: request-transformer
    route: gcs-upload-route
    config:
      remove:
        headers:
          - Authorization  # Remove user JWT
      add:
        headers:
          - "Authorization: Bearer ${GCP_ACCESS_TOKEN}"
      replace:
        headers:
          - "Content-Type: application/octet-stream"
    tags:
      - transform
      - gcs

  # ---------------------------------------------------------------------------
  # F. Response Transformer (Add Security Headers)
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "X-Kong-Proxy-Latency: true"
    tags:
      - security
      - headers

  # ---------------------------------------------------------------------------
  # G. HTTP Log Plugin (Global - Audit Logging via Django to Kafka)
  # ---------------------------------------------------------------------------
  # This plugin sends request/response logs to Django backend which forwards to Kafka
  # Using http-log instead of kafka-log since kafka plugins require Kong Enterprise
  - name: http-log
    config:
      http_endpoint: http://host.docker.internal:8000/api/v1/audit/kong-logs/
      method: POST
      timeout: 10000
      keepalive: 60000
      content_type: application/json
      retry_count: 3
      queue_size: 1000
      flush_timeout: 2
      # Custom log format
      custom_fields_by_lua:
        request_id: "return kong.request.get_header('X-Request-ID') or kong.tools.uuid.uuid()"
    tags:
      - logging
      - audit

# =============================================================================
# NOTE: Kafka Upstream Plugin Disabled
# =============================================================================
# The kafka-upstream plugin requires Kong Enterprise or custom plugin installation.
# For MVP, events are ingested via Django REST endpoint at /api/v1/events/ingest/
# which then publishes to Kafka using the kafka_service Django app.

# =============================================================================
# UPSTREAMS (Load Balancing - For Future Scaling)
# =============================================================================
upstreams:
  - name: backend-upstream
    algorithm: round-robin
    hash_on: none
    healthchecks:
      active:
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        http_path: /health/
        timeout: 3
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_failures: 3
    targets:
      - target: host.docker.internal:8000
        weight: 100
    tags:
      - backend
      - loadbalancing
