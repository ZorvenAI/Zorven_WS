# ==============================================================================
# Railway Configuration
# Defines services, build settings, and deployment configuration
# ==============================================================================

# Backend Service Configuration
[build]
builder = "dockerfile"
dockerfilePath = "deployment/docker/backend/Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"
port = 8000

[services.env]
PORT = "8000"
DJANGO_SETTINGS_MODULE = "brand_automator.settings"
PYTHONUNBUFFERED = "1"
# Multi-tenancy default GCS buckets (tenants can override)
RAW_GCP_BUCKET_NAME = "onboarding-bucket1"
CURATION_GCP_BUCKET_NAME = "brandsol-curation-bucket"
# Multi-tenancy: GCS bucket auto-provisioning
GCS_AUTO_PROVISION = "true"
GCP_PROJECT_ID = "brandsol"
