# ==============================================================================
# Railway Configuration
# Defines services, build settings, and deployment configuration
# ==============================================================================

# Backend Service Configuration
[build]
builder = "dockerfile"
dockerfilePath = "deployment/docker/backend/Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"
port = 8000

[services.env]
PORT = "8000"
DJANGO_SETTINGS_MODULE = "brand_automator.settings"
PYTHONUNBUFFERED = "1"
# Multi-tenancy default GCS buckets (tenants can override)
GCS_RAW_BUCKET = "onboarding-bucket1"
GCS_CURATED_BUCKET = "brandsol-curation-bucket"
