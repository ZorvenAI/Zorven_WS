  # --- Odoo Integration ---
  odoo-mcp-server:
    image: ghcr.io/zorvenai/zorven-odoo-mcp-server:development_main
    container_name: zorven-odoo-mcp
    environment:
      - ODOO_MCP_REDIS_URL=redis://redis:6379/9
      - ODOO_MCP_ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_MCP_DATABASE_URL=${DATABASE_URL}
    ports:
      - "8095:8095"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  odoo-worker-agent:
    image: ghcr.io/zorvenai/zorven-odoo-worker-agent:development_main
    container_name: zorven-odoo-worker
    environment:
      - ODOO_WORKER_REDIS_URL=redis://redis:6379/10
      - ODOO_WORKER_PROMPT_CACHE_REDIS_URL=redis://redis:6379/2
      - ODOO_WORKER_MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - ODOO_WORKER_MCP_SERVER_URL=http://odoo-mcp-server:8095
      - ODOO_WORKER_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # --- Prompt Optimization ---
  prompt-optimization:
    image: ghcr.io/zorvenai/zorven-prompt-optimization:development_main
    container_name: zorven-prompt-optimization
    environment:
      - POI_REDIS_URL=redis://redis:6379/26
      - POI_PROMPT_CACHE_REDIS_URL=redis://redis:6379/2
      - POI_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - POI_MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - POI_DATABASE_URL=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
    ports:
      - "8110:8110"
    depends_on:
      redis:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # --- Auto-Update (Watchtower) ---
  # Monitors GHCR for new image digests and restarts containers automatically.
  # When a new :development_main image is pushed, Watchtower pulls it and recreates the container.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: zorven-watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=false
      - WATCHTOWER_INCLUDE_STOPPED=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis_volume:
  mlflow_postgres_volume:
  mlflow_artifacts_volume:

networks:
  app-network:
    driver: bridge
