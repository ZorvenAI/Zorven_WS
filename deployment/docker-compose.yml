      - APA_ODOO_ENABLED=${APA_ODOO_ENABLED:-false}
      - APA_RAG_SERVICE_URL=http://rag-uploader-agent-svc:8070
      - APA_CONFIDENCE_THRESHOLD=${APA_CONFIDENCE_THRESHOLD:-0.7}
      - APA_TOKEN_BUDGET_PER_SESSION=${APA_TOKEN_BUDGET_PER_SESSION:-80000}
      - APA_MAX_PERSONAS=${APA_MAX_PERSONAS:-5}
      - APA_KAFKA_CONSUMERS_ENABLED=${APA_KAFKA_CONSUMERS_ENABLED:-false}
