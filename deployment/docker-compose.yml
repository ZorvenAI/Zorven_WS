# ==============================================================================
# Docker Compose Configuration
# Local development orchestration for AI Brand Automator
# With Kong Gateway, Kafka, and Zookeeper
# ==============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Kong Gateway - API Gateway (Entry Point)
  # All traffic flows through Kong on port 8000
  # ==========================================================================
  kong:
    build:
      context: .
      dockerfile: docker/kong/Dockerfile
    image: ghcr.io/naveenah/zorven-kong:latest
    container_name: ai-brand-automator-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yaml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_PLUGINS=bundled,jwt,cors,request-transformer,rate-limiting,response-transformer
      - JWT_SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - GCP_ACCESS_TOKEN=${GCP_ACCESS_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"   # Proxy - Main entry point
      - "8001:8001"   # Admin API (for debugging)
    volumes:
      - ./docker/kong/kong.yaml:/usr/local/kong/declarative/kong.yaml:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Backend - Django API (Internal Only - Accessed via Kong)
  # Port 8001 is NOT exposed to host, only accessible within Docker network
  # ==========================================================================
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-backend
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Kong Integration Settings
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,kong
      - KONG_ENABLED=true
      - USE_X_FORWARDED_HOST=true
      - USE_X_FORWARDED_PORT=true
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      # Port changed to 8001 (Kong is on 8000)
      - PORT=8001
      # Multi-tenancy: default GCS buckets (tenants can override)
      # Use the same accessible bucket for all pipeline stages
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-zorven-raw-assets}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-zorven-raw-assets}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-zorven-raw-assets}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-zorven-raw-assets}
      # Multi-tenancy: GCS bucket auto-provisioning
      - GCS_AUTO_PROVISION=${GCS_AUTO_PROVISION:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
      # Email (Mailgun HTTP API)
      - EMAIL_BACKEND=brand_automator.email_backends.MailgunAPIBackend
      # Pipeline: Use Celery sync pipeline (set true only with --profile with-kafka)
      - ONBOARDING_KAFKA_ENABLED=${ONBOARDING_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Orchestration service configuration
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:8010}
      - ORCHESTRATOR_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ORCHESTRATOR_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ORCHESTRATOR_TIMEOUT=${ORCHESTRATOR_TIMEOUT:-30}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8001}
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL:-http://backend:8001}
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      # Analytics Kafka events (metrics extracted, brand affinity rejected, rollup updated)
      - ANALYTICS_KAFKA_ENABLED=${ANALYTICS_KAFKA_ENABLED:-false}
      # Chat titling worker integration
      - WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token}
      - TITLING_KAFKA_ENABLED=${TITLING_KAFKA_ENABLED:-false}
      # Vertex AI Search / RAG Index settings
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-zorven-503517}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-zorven-rag-dev}
      - VERTEX_AI_MOCK_MODE=${VERTEX_AI_MOCK_MODE:-false}
      # DB-to-RAG sync (sync Django models to Vertex AI)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-7776e9d86dc564e3e9bd4921c056ae3e-f9517a64-4481b185}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-sandbox3c490c6302904ddda887a78852e81aea.mailgun.org}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-AI Brand Automator <postmaster@sandbox3c490c6302904ddda887a78852e81aea.mailgun.org>}
    # Port NOT exposed to host - only accessible via Kong
    expose:
      - "8001"
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-backend.sh:/scripts/start.sh:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Backend WebSocket - Daphne ASGI Server (workspace real-time)
  # ==========================================================================
  backend-ws:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-backend-ws
    command: ["daphne", "brand_automator.asgi:application", "--port", "8002", "--bind", "0.0.0.0"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CHANNELS_REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend-ws,kong
      - KONG_ENABLED=true
      - PORT=8002
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Frontend - Next.js
  # ==========================================================================
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend/Dockerfile
      args:
        # Frontend now talks to Kong on port 8000
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_BRAND_EQUITY_API_URL=http://localhost:8090
    image: ghcr.io/naveenah/zorven-frontend:latest
    container_name: ai-brand-automator-frontend
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      - NODE_ENV=development
      # API URL points to Kong Gateway
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_BRAND_EQUITY_API_URL=http://localhost:8090
    ports:
      - "3000:3000"
    volumes:
      - ../ai-brand-automator-frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Worker - Background task processor
  # ==========================================================================
  celery-worker:
    build:
      context: ..
      dockerfile: deployment/docker/celery-worker/Dockerfile
    image: ghcr.io/naveenah/zorven-celery-worker:latest
    container_name: ai-brand-automator-celery-worker
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CELERY_CONCURRENCY=4
      - CELERY_LOG_LEVEL=info
      # Multi-tenancy: default GCS buckets
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-zorven-raw-assets}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-zorven-raw-assets}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-zorven-raw-assets}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-zorven-raw-assets}
      # Multi-tenancy: GCS bucket auto-provisioning
      - GCS_AUTO_PROVISION=${GCS_AUTO_PROVISION:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
      # Orchestration service configuration
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:8010}
      - ORCHESTRATOR_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ORCHESTRATOR_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ORCHESTRATOR_TIMEOUT=${ORCHESTRATOR_TIMEOUT:-30}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8001}
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL:-http://backend:8001}
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      # Analytics Kafka events
      - ANALYTICS_KAFKA_ENABLED=${ANALYTICS_KAFKA_ENABLED:-false}
      # Chat titling worker integration
      - WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token}
      - TITLING_KAFKA_ENABLED=${TITLING_KAFKA_ENABLED:-false}
      # Vertex AI Search / RAG Index settings
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-zorven-503517}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-zorven-rag-dev}
      - VERTEX_AI_MOCK_MODE=${VERTEX_AI_MOCK_MODE:-false}
      # DB-to-RAG sync (sync Django models to Vertex AI)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-celery-worker.sh:/scripts/start.sh:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Beat - Periodic task scheduler
  # ==========================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: deployment/docker/celery-beat/Dockerfile
    image: ghcr.io/naveenah/zorven-celery-beat:latest
    container_name: ai-brand-automator-celery-beat
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_LOG_LEVEL=info
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      # DB-to-RAG sync (periodic sync schedule)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-celery-beat.sh:/scripts/start.sh:ro
      - celerybeat_volume:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Redis - Message broker and cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-brand-automator-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --databases 27
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Nginx - Reverse proxy (optional for local dev)
  # ==========================================================================
  nginx:
    build:
      context: ..
      dockerfile: deployment/docker/nginx/Dockerfile
    image: ghcr.io/naveenah/zorven-nginx:latest
    container_name: ai-brand-automator-nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-nginx

  # ==========================================================================
  # PostgreSQL - Local database (optional, use Neon in prod)
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: ai-brand-automator-db
    environment:
      - POSTGRES_DB=ai_brand_automator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-db

  # ==========================================================================
  # Zookeeper - Kafka Coordination Service
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-brand-automator-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Kafka - Event Streaming Platform
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-brand-automator-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB per partition
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Kafka UI - Web interface for Kafka management (optional)
  # ==========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ai-brand-automator-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Ingestion Consumer - Consumes raw-ingestion-topic, moves files to raw/
  # ==========================================================================
  ingestion-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-ingestion-consumer
    command: ["python", "manage.py", "run_ingestion", "--batch-size", "10", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-zorven-raw-assets}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-zorven-raw-assets}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-zorven-raw-assets}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-zorven-raw-assets}
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Curation Consumer - Consumes curation-needed-topic, curates files
  # ==========================================================================
  curation-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-curation-consumer
    command: ["python", "manage.py", "run_curation_consumer", "--batch-size", "10", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-zorven-raw-assets}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-zorven-raw-assets}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-zorven-raw-assets}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-zorven-raw-assets}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # RAG Index Consumer - Consumes rag-sync-ready-topic, indexes documents
  # ==========================================================================
  rag-index-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-rag-index-consumer
    command: ["python", "manage.py", "consume_sync_events", "--topic", "rag-sync-ready-topic", "--group", "rag-index-consumers", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
