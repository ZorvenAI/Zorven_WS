# ==============================================================================
# Docker Compose Configuration
# Local development orchestration for AI Brand Automator
# With Kong Gateway, Kafka, and Zookeeper
# ==============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Kong Gateway - API Gateway (Entry Point)
  # All traffic flows through Kong on port 8000
  # ==========================================================================
  kong:
    build:
      context: .
      dockerfile: docker/kong/Dockerfile
    container_name: ai-brand-automator-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yaml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_PLUGINS=bundled,jwt,cors,request-transformer,rate-limiting,response-transformer
      - JWT_SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - GCP_ACCESS_TOKEN=${GCP_ACCESS_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"   # Proxy - Main entry point
      - "8001:8001"   # Admin API (for debugging)
    volumes:
      - ./docker/kong/kong.yaml:/usr/local/kong/declarative/kong.yaml:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Backend - Django API (Internal Only - Accessed via Kong)
  # Port 8001 is NOT exposed to host, only accessible within Docker network
  # ==========================================================================
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-backend
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Kong Integration Settings
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,kong
      - KONG_ENABLED=true
      - USE_X_FORWARDED_HOST=true
      - USE_X_FORWARDED_PORT=true
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      # Port changed to 8001 (Kong is on 8000)
      - PORT=8001
      # Multi-tenancy: default GCS buckets (tenants can override)
      # Use the same accessible bucket for all pipeline stages
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      # Multi-tenancy: GCS bucket auto-provisioning
      - GCS_AUTO_PROVISION=${GCS_AUTO_PROVISION:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      # Email (Mailgun HTTP API)
      - EMAIL_BACKEND=brand_automator.email_backends.MailgunAPIBackend
      # Pipeline: Use Celery sync pipeline (set true only with --profile with-kafka)
      - ONBOARDING_KAFKA_ENABLED=${ONBOARDING_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Orchestration service configuration
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:8010}
      - ORCHESTRATOR_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ORCHESTRATOR_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ORCHESTRATOR_TIMEOUT=${ORCHESTRATOR_TIMEOUT:-30}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8001}
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL:-http://backend:8001}
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      # Chat titling worker integration
      - WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token}
      - TITLING_KAFKA_ENABLED=${TITLING_KAFKA_ENABLED:-false}
      # Vertex AI Search / RAG Index settings
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-brandsol-project}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-prevision-rag-dev}
      - VERTEX_AI_MOCK_MODE=${VERTEX_AI_MOCK_MODE:-false}
      # DB-to-RAG sync (sync Django models to Vertex AI)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-7776e9d86dc564e3e9bd4921c056ae3e-f9517a64-4481b185}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-sandbox3c490c6302904ddda887a78852e81aea.mailgun.org}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-AI Brand Automator <postmaster@sandbox3c490c6302904ddda887a78852e81aea.mailgun.org>}
    # Port NOT exposed to host - only accessible via Kong
    expose:
      - "8001"
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-backend.sh:/scripts/start.sh:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Frontend - Next.js
  # ==========================================================================
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend/Dockerfile
      args:
        # Frontend now talks to Kong on port 8000
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_BRAND_EQUITY_API_URL=http://localhost:8090
    container_name: ai-brand-automator-frontend
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      - NODE_ENV=development
      # API URL points to Kong Gateway
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_BRAND_EQUITY_API_URL=http://localhost:8090
    ports:
      - "3000:3000"
    volumes:
      - ../ai-brand-automator-frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Worker - Background task processor
  # ==========================================================================
  celery-worker:
    build:
      context: ..
      dockerfile: deployment/docker/celery-worker/Dockerfile
    container_name: ai-brand-automator-celery-worker
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CELERY_CONCURRENCY=4
      - CELERY_LOG_LEVEL=info
      # Multi-tenancy: default GCS buckets
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      # Multi-tenancy: GCS bucket auto-provisioning
      - GCS_AUTO_PROVISION=${GCS_AUTO_PROVISION:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      # Orchestration service configuration
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:8010}
      - ORCHESTRATOR_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ORCHESTRATOR_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ORCHESTRATOR_TIMEOUT=${ORCHESTRATOR_TIMEOUT:-30}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8001}
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL:-http://backend:8001}
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      # Chat titling worker integration
      - WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token}
      - TITLING_KAFKA_ENABLED=${TITLING_KAFKA_ENABLED:-false}
      # Vertex AI Search / RAG Index settings
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-brandsol-project}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-prevision-rag-dev}
      - VERTEX_AI_MOCK_MODE=${VERTEX_AI_MOCK_MODE:-false}
      # DB-to-RAG sync (sync Django models to Vertex AI)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-celery-worker.sh:/scripts/start.sh:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Beat - Periodic task scheduler
  # ==========================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: deployment/docker/celery-beat/Dockerfile
    container_name: ai-brand-automator-celery-beat
    command: ["bash", "/scripts/start.sh"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_LOG_LEVEL=info
      # Orchestration Kafka integration
      - ORCHESTRATION_KAFKA_ENABLED=${ORCHESTRATION_KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      # DB-to-RAG sync (periodic sync schedule)
      - RAG_DB_SYNC_ENABLED=${RAG_DB_SYNC_ENABLED:-false}
    volumes:
      - ../ai-brand-automator:/app
      - ./scripts/start-celery-beat.sh:/scripts/start.sh:ro
      - celerybeat_volume:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Redis - Message broker and cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-brand-automator-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Nginx - Reverse proxy (optional for local dev)
  # ==========================================================================
  nginx:
    build:
      context: ..
      dockerfile: deployment/docker/nginx/Dockerfile
    container_name: ai-brand-automator-nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-nginx

  # ==========================================================================
  # PostgreSQL - Local database (optional, use Neon in prod)
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: ai-brand-automator-db
    environment:
      - POSTGRES_DB=ai_brand_automator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-db

  # ==========================================================================
  # Zookeeper - Kafka Coordination Service
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-brand-automator-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Kafka - Event Streaming Platform
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-brand-automator-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB per partition
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Kafka UI - Web interface for Kafka management (optional)
  # ==========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ai-brand-automator-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Ingestion Consumer - Consumes raw-ingestion-topic, moves files to raw/
  # ==========================================================================
  ingestion-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-ingestion-consumer
    command: ["python", "manage.py", "run_ingestion", "--batch-size", "10", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Curation Consumer - Consumes curation-needed-topic, curates files
  # ==========================================================================
  curation-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-curation-consumer
    command: ["python", "manage.py", "run_curation_consumer", "--batch-size", "10", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # RAG Index Consumer - Consumes rag-sync-ready-topic, indexes documents
  # ==========================================================================
  rag-index-consumer:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-rag-index-consumer
    command: ["python", "manage.py", "consume_sync_events", "--topic", "rag-sync-ready-topic", "--group", "rag-index-consumers", "--poll-timeout", "1.0"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - RAW_GCP_BUCKET_NAME=${RAW_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CURATION_GCP_BUCKET_NAME=${CURATION_GCP_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # RAG Index settings
      - RAG_INDEX_MOCK_MODE=${RAG_INDEX_MOCK_MODE:-true}
      - VERTEX_AI_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-central1}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-}
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-kafka

  # ==========================================================================
  # Pipeline Orchestrator — LangGraph-based pipeline execution engine
  # Receives dispatch requests from backend, executes manifests, reports via callbacks
  # ==========================================================================
  orchestrator:
    build:
      context: ../pipeline-orchestrator-svc
      dockerfile: Dockerfile
    container_name: ai-brand-automator-orchestrator
    environment:
      - ORCHESTRATOR_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ORCHESTRATOR_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ORCHESTRATOR_REDIS_URL=redis://redis:6379/1
      - ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS=${ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - ORCHESTRATOR_LOG_LEVEL=INFO
      # Vertex AI Search / Gemini (Default Agent Node - RAG queries)
      - ORCHESTRATOR_VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-brandsol-project}
      - ORCHESTRATOR_VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
      - ORCHESTRATOR_VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-prevision-rag-dev}
      - ORCHESTRATOR_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator/credentials:/app/credentials:ro
    expose:
      - "8010"
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Discovery Agent — Web research and content curation
  # Searches via Tavily, scrapes URLs, cleans HTML, returns structured findings
  # ==========================================================================
  discovery-agent-svc:
    build:
      context: ../discovery-agent-svc
      dockerfile: Dockerfile
    container_name: ai-brand-automator-discovery-agent
    environment:
      - DISCOVERY_REDIS_URL=redis://redis:6379/2
      - DISCOVERY_KAFKA_BOOTSTRAP_SERVERS=${DISCOVERY_KAFKA_BOOTSTRAP_SERVERS:-}
      # Kafka integration is disabled by default (empty bootstrap servers).
      # To enable Kafka when running the full event streaming stack, either:
      #   export DISCOVERY_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # or uncomment the line below:
      #   - DISCOVERY_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DISCOVERY_TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DISCOVERY_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DISCOVERY_LOG_LEVEL=INFO
    expose:
      - "8020"
    ports:
      - "8020:8020"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Intelligence Agent — ISO 10668 brand valuation and analytical intelligence
  # Royalty Relief NPV, BSI scoring, competitive gap analysis, theme extraction
  # ==========================================================================
  intelligence-agent-svc:
    build:
      context: ../intelligence-agent-svc
      dockerfile: Dockerfile
    container_name: ai-brand-automator-intelligence-agent
    environment:
      - INTELLIGENCE_REDIS_URL=redis://redis:6379/3
      - INTELLIGENCE_KAFKA_BOOTSTRAP_SERVERS=${INTELLIGENCE_KAFKA_BOOTSTRAP_SERVERS:-}
      # Kafka integration is disabled by default (empty bootstrap servers).
      # To enable Kafka when running the full event streaming stack, either:
      #   export INTELLIGENCE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # or uncomment the line below:
      #   - INTELLIGENCE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INTELLIGENCE_GEMINI_API_KEY=${GOOGLE_API_KEY:-}
      - INTELLIGENCE_GCS_PROJECT_ID=${GCP_PROJECT_ID:-}
      - INTELLIGENCE_GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - INTELLIGENCE_LOG_LEVEL=INFO
    expose:
      - "8030"
    ports:
      - "8030:8030"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Chat Titling Worker — Auto-titles new chat sessions via Gemini Flash
  # Consumes from chat-titling-topic, PATCHes titles back to backend
  # ==========================================================================
  chat-titling-worker:
    build:
      context: ../chat-titling-worker
      dockerfile: Dockerfile
    container_name: ai-brand-automator-titling-worker
    environment:
      - TITLING_REDIS_URL=redis://redis:6379/4
      - TITLING_KAFKA_BOOTSTRAP_SERVERS=${TITLING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - TITLING_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TITLING_CORE_API_URL=http://backend:8001
      - TITLING_WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token}
      - TITLING_LOG_LEVEL=INFO
    expose:
      - "8040"
    ports:
      - "8040:8040"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Content Agent — SEO/AEO/GEO-compliant blog authoring
  # Receives research data from discovery-agent, authors Markdown blogs
  # ==========================================================================
  content-agent-svc:
    build:
      context: ../content-agent-service
      dockerfile: Dockerfile
    container_name: ai-brand-automator-content-agent
    environment:
      - CONTENT_REDIS_URL=redis://redis:6379/5
      - CONTENT_KAFKA_BOOTSTRAP_SERVERS=${CONTENT_KAFKA_BOOTSTRAP_SERVERS:-}
      # Kafka integration is disabled by default (empty bootstrap servers).
      # To enable Kafka when running the full event streaming stack, either:
      #   export CONTENT_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # or uncomment the line below:
      #   - CONTENT_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONTENT_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CONTENT_GCS_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - CONTENT_GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - CONTENT_CORE_API_URL=http://backend:8001
      - CONTENT_CORE_API_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - CONTENT_LOG_LEVEL=INFO
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator/credentials:/app/credentials:ro
    expose:
      - "8050"
    ports:
      - "8050:8050"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # MCP Server — Model Context Protocol server (SSE transport)
  # Exposes automation tools (scheduling, publishing, profiles) to AI agents
  # ==========================================================================
  mcp-server:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-mcp-server
    command: ["python", "run_mcp_server.py", "--transport", "sse", "--port", "8085", "--host", "0.0.0.0"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator:/app
    expose:
      - "8085"
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Social Agent — Social media promotion and publishing
  # Adapts blog content to platform-specific posts, delegates publishing to Django
  # ==========================================================================
  social-agent-svc:
    build:
      context: ../social-agent-service
      dockerfile: Dockerfile
    container_name: ai-brand-automator-social-agent
    environment:
      - SOCIAL_REDIS_URL=redis://redis:6379/6
      - SOCIAL_KAFKA_BOOTSTRAP_SERVERS=${SOCIAL_KAFKA_BOOTSTRAP_SERVERS:-}
      # Kafka integration is disabled by default (empty bootstrap servers).
      # To enable Kafka when running the full event streaming stack, either:
      #   export SOCIAL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # or uncomment the line below:
      #   - SOCIAL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SOCIAL_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SOCIAL_CORE_API_URL=http://backend:8001
      - SOCIAL_CORE_API_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - SOCIAL_MCP_SERVER_URL=http://mcp-server:8085/sse
      - SOCIAL_LOG_LEVEL=INFO
    expose:
      - "8060"
    ports:
      - "8060:8060"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8060/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # RAG Uploader Agent — Persists documents to Vertex AI RAG Store
  # Extracts file references from pipeline context, emits ingestion events
  # ==========================================================================
  rag-uploader-agent-svc:
    build:
      context: ../rag-uploader-agent-service
      dockerfile: Dockerfile
    container_name: ai-brand-automator-rag-uploader
    environment:
      - UPLOADER_REDIS_URL=redis://redis:6379/7
      - UPLOADER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - UPLOADER_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - UPLOADER_GCS_PROJECT_ID=${GCP_PROJECT_ID:-brandsol}
      - UPLOADER_GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-onboarding-brandsol-customer-bucket-1}
      - UPLOADER_CORE_API_URL=http://backend:8001
      - UPLOADER_CORE_API_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - UPLOADER_LOG_LEVEL=INFO
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator/credentials:/app/credentials:ro
    expose:
      - "8070"
    ports:
      - "8070:8070"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Odoo MCP Server — MCP bridge between AI agents and Odoo ERP
  # 101 MCP tools, multi-tenancy, RBAC, RAG integration
  # ==========================================================================
  odoo-mcp-server:
    build:
      context: ../odoo-mcp-server-svc
      dockerfile: Dockerfile
    container_name: ai-brand-automator-odoo-mcp
    environment:
      - ODOO_MCP_REDIS_URL=redis://redis:6379/9
      - ODOO_MCP_ODOO_URL=${ODOO_URL:-http://localhost:8069}
      - ODOO_MCP_ODOO_MASTER_PASSWORD=${ODOO_MASTER_PASSWORD:-}
      - ODOO_MCP_KAFKA_BOOTSTRAP_SERVERS=${ODOO_MCP_KAFKA_BOOTSTRAP_SERVERS:-}
      - ODOO_MCP_RAG_SERVICE_URL=http://rag-uploader-agent-svc:8070
      - ODOO_MCP_RAG_ENABLED=${ODOO_MCP_RAG_ENABLED:-false}
      - ODOO_MCP_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ODOO_MCP_LOG_LEVEL=INFO
      - ODOO_MCP_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    expose:
      - "8095"
    ports:
      - "8095:8095"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Brand Equity Calculator — ISO 20671:2019 brand evaluation (public)
  # Powered by Claude AI (Anthropic). No auth required.
  # ==========================================================================
  brand-equity-calculator:
    build:
      context: ../brand-equity-calculator-svc
      dockerfile: Dockerfile
    container_name: ai-brand-automator-brand-equity
    environment:
      - BRAND_EQUITY_REDIS_URL=redis://redis:6379/8
      - BRAND_EQUITY_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BRAND_EQUITY_LOG_LEVEL=INFO
      - BRAND_EQUITY_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - BRAND_EQUITY_MAILGUN_API_KEY=${BRAND_EQUITY_MAILGUN_API_KEY:-}
      - BRAND_EQUITY_MAILGUN_DOMAIN=${BRAND_EQUITY_MAILGUN_DOMAIN:-}
    expose:
      - "8090"
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  static_volume:
  media_volume:
  redis_volume:
  postgres_volume:
  celerybeat_volume:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

# ==========================================================================
# Networks
# ==========================================================================
networks:
  app-network:
    driver: bridge
