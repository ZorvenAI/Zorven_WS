      # RAG Index settings
      - RAG_INDEX_MOCK_MODE=${RAG_INDEX_MOCK_MODE:-true}
      - VERTEX_AI_PROJECT_ID=${GCP_PROJECT_ID:-zorven-503517}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-central1}
      - VERTEX_AI_DATA_STORE_ID=${VERTEX_AI_DATA_STORE_ID:-}
    volumes:
