  # ==========================================================================
  # MCP Server — Model Context Protocol server (SSE transport)
  # Exposes automation tools (scheduling, publishing, profiles) to AI agents
  # ==========================================================================
  mcp-server:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    image: ghcr.io/naveenah/zorven-backend:latest
    container_name: ai-brand-automator-mcp-server
    command: ["python", "run_mcp_server.py", "--transport", "sse", "--port", "8085", "--host", "0.0.0.0"]
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator:/app
    expose:
      - "8085"
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
