      - ORCHESTRATOR_MARKET_RESEARCH_AGENT_URL=http://market-research-agent-svc:8021
      - ORCHESTRATOR_COMPETITOR_INTEL_AGENT_URL=http://competitor-intel-agent-svc:8022
      - ORCHESTRATOR_AUDIENCE_PERSONA_AGENT_URL=http://audience-persona-agent-svc:8023
      - ORCHESTRATOR_TREND_CULTURAL_AGENT_URL=http://trend-cultural-agent-svc:8024
      - ORCHESTRATOR_VOC_AGENT_URL=http://voc-agent-svc:8025
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcs-credentials.json
    volumes:
      - ../ai-brand-automator/credentials:/app/credentials:ro
    expose:
      - "8010"
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
