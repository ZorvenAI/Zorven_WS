      - VOCA_TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - VOCA_LOG_LEVEL=${VOCA_LOG_LEVEL:-INFO}
      - VOCA_HOST=0.0.0.0
      - VOCA_PORT=8025
      - VOCA_RAG_SERVICE_URL=http://rag-uploader-agent-svc:8070
      - VOCA_GCS_PROJECT_ID=${GCS_PROJECT_ID:-}
      - VOCA_GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - VOCA_GCS_CREDENTIALS_JSON=${GCS_CREDENTIALS_JSON:-}
      - VOCA_CORE_API_URL=http://backend:8001
      - VOCA_CORE_API_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - VOCA_KAFKA_CONSUMERS_ENABLED=${VOCA_KAFKA_CONSUMERS_ENABLED:-false}
      - VOCA_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - VOCA_ODOO_ENABLED=${VOCA_ODOO_ENABLED:-false}
