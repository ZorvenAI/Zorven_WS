# ==============================================================================
# Docker Compose Configuration
# Local development orchestration for AI Brand Automator
# ==============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Backend - Django API
  # ==========================================================================
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: ai-brand-automator-backend
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../ai-brand-automator:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Frontend - Next.js
  # ==========================================================================
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: ai-brand-automator-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../ai-brand-automator-frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Worker - Background task processor
  # ==========================================================================
  celery-worker:
    build:
      context: ..
      dockerfile: deployment/docker/celery-worker/Dockerfile
    container_name: ai-brand-automator-celery-worker
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CELERY_CONCURRENCY=2
      - CELERY_LOG_LEVEL=info
    volumes:
      - ../ai-brand-automator:/app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Celery Beat - Periodic task scheduler
  # ==========================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: deployment/docker/celery-beat/Dockerfile
    container_name: ai-brand-automator-celery-beat
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/ai_brand_automator}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_LOG_LEVEL=info
    volumes:
      - ../ai-brand-automator:/app
      - celerybeat_volume:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Redis - Message broker and cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-brand-automator-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Nginx - Reverse proxy (optional for local dev)
  # ==========================================================================
  nginx:
    build:
      context: ..
      dockerfile: deployment/docker/nginx/Dockerfile
    container_name: ai-brand-automator-nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-nginx

  # ==========================================================================
  # PostgreSQL - Local database (optional, use Neon in prod)
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: ai-brand-automator-db
    environment:
      - POSTGRES_DB=ai_brand_automator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-db

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  static_volume:
  media_volume:
  redis_volume:
  postgres_volume:
  celerybeat_volume:

# ==========================================================================
# Networks
# ==========================================================================
networks:
  app-network:
    driver: bridge
