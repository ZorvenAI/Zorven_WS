      - ORCHESTRATOR_VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-zorven-503517}
      - ORCHESTRATOR_VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-global}
