      - COA_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - COA_META_ADS_SANDBOX_MODE=true
      - COA_CELERY_BROKER_URL=redis://redis:6379/24
      - COA_LOG_LEVEL=INFO
      - COA_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    expose:
      - "8044"
    ports:
      - "8044:8044"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8044/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # --- Intelligence Loop Agent (ILA-3.5) ---
  intelligence-loop-agent-svc:
    build:
      context: ../intelligence-loop-agent-svc
      dockerfile: Dockerfile
    image: ghcr.io/naveenah/zorven-intelligence-loop-agent:latest
    container_name: ai-brand-automator-intelligence-loop
    environment:
      - ILA_REDIS_URL=redis://redis:6379/25
      - ILA_PROMPT_CACHE_REDIS_URL=redis://redis:6379/2
      - ILA_MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - ILA_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ILA_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ILA_BACKEND_URL=http://backend:8001
      - ILA_BACKEND_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - ILA_CALLBACK_TOKEN=${ORCHESTRATOR_CALLBACK_TOKEN:-dev-callback-token}
      - ILA_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ILA_LOG_LEVEL=INFO
      - ILA_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    expose:
      - "8045"
    ports:
      - "8045:8045"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8045/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # MLflow PostgreSQL — Dedicated database for MLflow Tracking Server
  # Stores prompt registry, experiment tracking, and run metadata
  # ==========================================================================
  onboarding-intelligence-agent-svc:
    build:
      context: ../onboarding-intelligence-agent-svc
      dockerfile: Dockerfile
    image: ghcr.io/naveenah/zorven-onboarding-intelligence-agent:latest
    container_name: ai-brand-automator-onboarding-intelligence
    environment:
      # ERRATA-01: DB 2 with the oia:v1: prefix, not DB 27. Production Redis is
      # Memorystore, which is fixed at 16 databases and has no DB 27.
      - OIA_REDIS_URL=redis://redis:6379/2
      - OIA_REDIS_DB=2
      - OIA_POI_PROMPT_CACHE_DB=2
      - OIA_BACKEND_BASE_URL=http://backend:8001
      - OIA_GCS_BUCKET=${GS_BUCKET_NAME:-zorven-raw-assets}
      - OIA_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - OIA_POI_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - OIA_GEMINI_KEY=${GOOGLE_API_KEY:-}
      - OIA_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OIA_LOG_LEVEL=INFO
    expose:
      - "8120"
    ports:
      - "8120:8120"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8120/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  mlflow-db:
    image: postgres:15-alpine
    container_name: ai-brand-automator-mlflow-db
    environment:
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD:-mlflow}
    ports:
      - "5435:5432"
    volumes:
      - mlflow_postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # MLflow Tracking Server — Prompt registry and experiment tracking
  # Central versioned prompt registry for all 15 agent services
  # Backend store: PostgreSQL | Artifact store: local volume
  # ==========================================================================
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: ghcr.io/naveenah/zorven-mlflow-server:latest
    container_name: ai-brand-automator-mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    ports:
      - "${MLFLOW_HOST_PORT:-5050}:5000"
    volumes:
      - mlflow_artifacts_volume:/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Prompt Optimization Service — MLflow prompt registry + GEPA optimization
  # Central prompt management, optimization, and dataset CRUD for all agents
  # ==========================================================================
  prompt-optimization-svc:
    build:
      context: ../prompt-optimization-svc
      dockerfile: Dockerfile
    image: ghcr.io/naveenah/zorven-prompt-optimization:latest
    container_name: ai-brand-automator-prompt-optimization
    environment:
      - POI_REDIS_URL=redis://redis:6379/26
      - POI_PROMPT_CACHE_REDIS_URL=redis://redis:6379/2
      - POI_KAFKA_BOOTSTRAP_SERVERS=${POI_KAFKA_BOOTSTRAP_SERVERS:-}
      - POI_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - POI_MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - POI_DATABASE_URL=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
      - POI_LOG_LEVEL=${POI_LOG_LEVEL:-INFO}
      - POI_HOST=0.0.0.0
      - POI_PORT=8110
      - POI_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - POI_JWT_SECRET=${SECRET_KEY:-dev-secret-key-change-in-production}
      - POI_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    expose:
      - "8110"
    ports:
      - "8110:8110"
    depends_on:
      redis:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  # ==========================================================================
  # Brand Equity Calculator — ISO 20671:2019 brand evaluation (public)
  # Powered by Claude AI (Anthropic). No auth required.
  # ==========================================================================
  brand-equity-calculator:
    build:
      context: ../brand-equity-calculator-svc
      dockerfile: Dockerfile
    image: ghcr.io/naveenah/zorven-brand-equity-calculator:latest
    container_name: ai-brand-automator-brand-equity
    environment:
      - BRAND_EQUITY_REDIS_URL=redis://redis:6379/8
      - BRAND_EQUITY_PROMPT_CACHE_REDIS_URL=redis://redis:6379/2
      - BRAND_EQUITY_MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - BRAND_EQUITY_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BRAND_EQUITY_LOG_LEVEL=INFO
      - BRAND_EQUITY_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - BRAND_EQUITY_MAILGUN_API_KEY=${BRAND_EQUITY_MAILGUN_API_KEY:-}
      - BRAND_EQUITY_MAILGUN_DOMAIN=${BRAND_EQUITY_MAILGUN_DOMAIN:-}
    expose:
      - "8090"
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  static_volume:
  media_volume:
  redis_volume:
  postgres_volume:
  celerybeat_volume:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  odoo_postgres_volume:
  odoo_data_volume:
  odoo_addons_volume:
  mlflow_postgres_volume:
  mlflow_artifacts_volume:

# ==========================================================================
# Networks
# ==========================================================================
networks:
  app-network:
    driver: bridge
