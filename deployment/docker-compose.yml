      - CIA_MAX_COMPETITORS=${CIA_MAX_COMPETITORS:-20}
      - CIA_KAFKA_CONSUMERS_ENABLED=${CIA_KAFKA_CONSUMERS_ENABLED:-false}
      - CIA_SERVICE_TOKEN=${ORCHESTRATOR_SERVICE_TOKEN:-dev-service-token}
      - CIA_TAVILY_MCP_SERVER_URL=${TAVILY_MCP_SERVER_URL:-}
    expose:
      - "8022"
    ports:
      - "18022:8022"
    depends_on:
