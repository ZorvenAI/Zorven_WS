version: "3.8"

services:
  discovery-agent:
    build: .
    ports:
      - "8020:8020"
    environment:
      DISCOVERY_HOST: "0.0.0.0"
      DISCOVERY_PORT: "8020"
      DISCOVERY_REDIS_URL: "redis://redis:6379/2"
      DISCOVERY_KAFKA_BOOTSTRAP_SERVERS: ""
      DISCOVERY_TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      DISCOVERY_LOG_LEVEL: "INFO"
      DISCOVERY_GCS_PROJECT_ID: ""
      DISCOVERY_GCS_BUCKET_NAME: ""
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
