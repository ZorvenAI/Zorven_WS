[flake8]
max-line-length = 88
extend-ignore = E203, W503, F403, F405
per-file-ignores =
    automation/mcp_server.py: E501
    test_mcp_server.py: E501
    tests/*.py: F841
    data_ingestion/tests/*.py: E501, F841
    data_ingestion/domain/models.py: E501
    data_ingestion/ports/*.py: E501
    data_ingestion/management/commands/*.py: E501
exclude = 
    .venv,
    venv,
    __pycache__,
    migrations,
    .git,
    .tox,
    build,
    dist,
    *.egg-info