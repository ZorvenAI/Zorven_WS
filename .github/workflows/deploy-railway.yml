      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Odoo MCP Server
        run: |
          if [ -n "${{ secrets.RAILWAY_ODOO_MCP_SERVICE }}" ]; then
            railway up --service ${{ secrets.RAILWAY_ODOO_MCP_SERVICE }} --detach
          else
