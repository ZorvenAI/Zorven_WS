          echo "Waiting for odoo-mcp-server deployment to complete..."
          sleep 30

      - name: Health check
        run: |
          ODOO_MCP_URL="${{ secrets.RAILWAY_ODOO_MCP_URL }}"
          if [ -n "$ODOO_MCP_URL" ]; then
