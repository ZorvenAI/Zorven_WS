          fi

  # ==========================================================================
  # Deploy Odoo Worker Agent to Railway
  # ==========================================================================
  deploy-odoo-worker-agent:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: always() && (needs.pre-deploy-checks.outputs.odoo-worker-changed == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Odoo Worker Agent
        run: |
          if [ -n "${{ secrets.RAILWAY_ODOO_WORKER_SERVICE }}" ]; then
            railway up --service ${{ secrets.RAILWAY_ODOO_WORKER_SERVICE }} --detach
          else
            echo "RAILWAY_ODOO_WORKER_SERVICE not set, skipping odoo-worker-agent deployment"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          echo "Waiting for odoo-worker-agent deployment to complete..."
          sleep 30

      - name: Health check
        run: |
          ODOO_WORKER_URL="${{ secrets.RAILWAY_ODOO_WORKER_URL }}"
          if [ -n "$ODOO_WORKER_URL" ]; then
            curl -f "${ODOO_WORKER_URL}/health" || echo "Health check failed - deployment may still be in progress"
          else
            echo "RAILWAY_ODOO_WORKER_URL not set, skipping health check"
          fi

