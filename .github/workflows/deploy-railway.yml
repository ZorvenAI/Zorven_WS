          fi

  # ==========================================================================
  # Deploy RAG Uploader Agent to Railway
  # ==========================================================================
  deploy-rag-uploader:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: always() && (needs.pre-deploy-checks.outputs.rag-uploader-changed == 'true' || github.event_name == 'workflow_dispatch')
