# ==============================================================================
# Railway Deployment Workflow
# Automatically deploys to Railway on push to main branch
# ==============================================================================

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # ==========================================================================
  # Pre-deployment Checks
  # ==========================================================================
  pre-deploy-checks:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      orchestrator-changed: ${{ steps.changes.outputs.orchestrator }}
      discovery-changed: ${{ steps.changes.outputs.discovery }}
      intelligence-changed: ${{ steps.changes.outputs.intelligence }}
      titling-changed: ${{ steps.changes.outputs.titling }}
      content-changed: ${{ steps.changes.outputs.content }}
      social-changed: ${{ steps.changes.outputs.social }}
      rag-uploader-changed: ${{ steps.changes.outputs.rag-uploader }}
      odoo-mcp-changed: ${{ steps.changes.outputs.odoo-mcp }}
      odoo-worker-changed: ${{ steps.changes.outputs.odoo-worker }}
      market-research-changed: ${{ steps.changes.outputs.market-research }}
      competitor-intel-changed: ${{ steps.changes.outputs.competitor-intel }}
      brand-positioning-changed: ${{ steps.changes.outputs.brand-positioning }}
      brand-architecture-changed: ${{ steps.changes.outputs.brand-architecture }}
      brand-personality-changed: ${{ steps.changes.outputs.brand-personality }}
      audience-persona-changed: ${{ steps.changes.outputs.audience-persona }}
      trend-cultural-changed: ${{ steps.changes.outputs.trend-cultural }}
      voc-agent-changed: ${{ steps.changes.outputs.voc-agent }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for changes
        id: changes
        run: |
          # Ensure there is a previous commit to diff against.
          # If there is no HEAD~1 (e.g., first commit), treat everything as changed.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No previous commit found; treating all services as changed."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "orchestrator=true" >> "$GITHUB_OUTPUT"
            echo "discovery=true" >> "$GITHUB_OUTPUT"
            echo "intelligence=true" >> "$GITHUB_OUTPUT"
            echo "titling=true" >> "$GITHUB_OUTPUT"
            echo "content=true" >> "$GITHUB_OUTPUT"
            echo "social=true" >> "$GITHUB_OUTPUT"
            echo "rag-uploader=true" >> "$GITHUB_OUTPUT"
            echo "odoo-mcp=true" >> "$GITHUB_OUTPUT"
            echo "odoo-worker=true" >> "$GITHUB_OUTPUT"
            echo "market-research=true" >> "$GITHUB_OUTPUT"
            echo "competitor-intel=true" >> "$GITHUB_OUTPUT"
            echo "brand-positioning=true" >> "$GITHUB_OUTPUT"
            echo "brand-architecture=true" >> "$GITHUB_OUTPUT"
            echo "brand-personality=true" >> "$GITHUB_OUTPUT"
            echo "audience-persona=true" >> "$GITHUB_OUTPUT"
            echo "trend-cultural=true" >> "$GITHUB_OUTPUT"
            echo "voc-agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Check if backend changed (includes MCP server which shares backend codebase)
          if git diff --name-only HEAD~1 | grep -qE '^ai-brand-automator/|^deployment/docker/backend/|^deployment/scripts/|^deployment/docker/mcp-server/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Check if frontend changed
          if git diff --name-only HEAD~1 | grep -qE '^ai-brand-automator-frontend/|^deployment/docker/frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if pipeline-orchestrator-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^pipeline-orchestrator-svc/'; then
            echo "orchestrator=true" >> "$GITHUB_OUTPUT"
          else
            echo "orchestrator=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if discovery-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^discovery-agent-svc/'; then
            echo "discovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "discovery=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if intelligence-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^intelligence-agent-svc/'; then
            echo "intelligence=true" >> "$GITHUB_OUTPUT"
          else
            echo "intelligence=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if chat-titling-worker changed
          if git diff --name-only HEAD~1 | grep -qE '^chat-titling-worker/'; then
            echo "titling=true" >> "$GITHUB_OUTPUT"
          else
            echo "titling=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if content-agent-service changed
          if git diff --name-only HEAD~1 | grep -qE '^content-agent-service/'; then
            echo "content=true" >> "$GITHUB_OUTPUT"
          else
            echo "content=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if social-agent-service changed
          if git diff --name-only HEAD~1 | grep -qE '^social-agent-service/'; then
            echo "social=true" >> "$GITHUB_OUTPUT"
          else
            echo "social=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if rag-uploader-agent-service changed
          if git diff --name-only HEAD~1 | grep -qE '^rag-uploader-agent-service/'; then
            echo "rag-uploader=true" >> "$GITHUB_OUTPUT"
          else
            echo "rag-uploader=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if odoo-mcp-server-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^odoo-mcp-server-svc/'; then
            echo "odoo-mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "odoo-mcp=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if odoo-worker-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^odoo-worker-agent-svc/'; then
            echo "odoo-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "odoo-worker=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if market-research-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^market-research-agent-svc/'; then
            echo "market-research=true" >> "$GITHUB_OUTPUT"
          else
            echo "market-research=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if competitor-intel-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^competitor-intel-agent-svc/'; then
            echo "competitor-intel=true" >> "$GITHUB_OUTPUT"
          else
            echo "competitor-intel=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if brand-positioning-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^brand-positioning-agent-svc/'; then
            echo "brand-positioning=true" >> "$GITHUB_OUTPUT"
          else
            echo "brand-positioning=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if brand-architecture-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^brand-architecture-agent-svc/'; then
            echo "brand-architecture=true" >> "$GITHUB_OUTPUT"
          else
            echo "brand-architecture=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if brand-personality-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^brand-personality-agent-svc/'; then
            echo "brand-personality=true" >> "$GITHUB_OUTPUT"
          else
            echo "brand-personality=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if audience-persona-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^audience-persona-agent-svc/'; then
            echo "audience-persona=true" >> "$GITHUB_OUTPUT"
          else
            echo "audience-persona=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if trend-cultural-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^trend-cultural-agent-svc/'; then
            echo "trend-cultural=true" >> "$GITHUB_OUTPUT"
          else
            echo "trend-cultural=false" >> "$GITHUB_OUTPUT"
          fi

          # Check if voc-agent-svc changed
          if git diff --name-only HEAD~1 | grep -qE '^voc-agent-svc/'; then
            echo "voc-agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "voc-agent=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # Deploy Backend to Railway
  # ==========================================================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    if: needs.pre-deploy-checks.outputs.backend-changed == 'true' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy Backend
        run: |
          railway up --service ${{ secrets.RAILWAY_BACKEND_SERVICE }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Wait for deployment
        run: |
          echo "Waiting for backend deployment to complete..."
          sleep 30
      
      - name: Health check
        run: |
          BACKEND_URL="${{ secrets.RAILWAY_BACKEND_URL }}"
          if [ -n "$BACKEND_URL" ]; then
            curl -f "${BACKEND_URL}/health/" || echo "Health check failed - deployment may still be in progress"
          else
            echo "RAILWAY_BACKEND_URL not set, skipping health check"
          fi

  # ==========================================================================
  # Deploy Frontend to Railway
  # ==========================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, deploy-backend]
    if: always() && (needs.pre-deploy-checks.outputs.frontend-changed == 'true' || github.event_name == 'workflow_dispatch')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy Frontend
        run: |
          railway up --service ${{ secrets.RAILWAY_FRONTEND_SERVICE }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Wait for deployment
        run: |
          echo "Waiting for frontend deployment to complete..."
          sleep 60
      
      - name: Health check
        run: |
          FRONTEND_URL="${{ secrets.RAILWAY_FRONTEND_URL }}"
          if [ -n "$FRONTEND_URL" ]; then
            curl -f "${FRONTEND_URL}" || echo "Health check failed - deployment may still be in progress"
          else
            echo "RAILWAY_FRONTEND_URL not set, skipping health check"
          fi

  # ==========================================================================
  # Deploy Celery Worker to Railway (Optional - skipped if service doesn't exist)
  # ==========================================================================
  deploy-celery-worker:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, deploy-backend]
    if: always() && (needs.pre-deploy-checks.outputs.backend-changed == 'true' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy Celery Worker
        run: |
          if [ -n "${{ secrets.RAILWAY_CELERY_WORKER_SERVICE }}" ]; then
            railway up --service ${{ secrets.RAILWAY_CELERY_WORKER_SERVICE }} --detach
          else
            echo "RAILWAY_CELERY_WORKER_SERVICE not set, skipping celery-worker deployment"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ==========================================================================
  # Deploy Celery Beat to Railway (Optional - skipped if service doesn't exist)
  # ==========================================================================
  deploy-celery-beat:
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, deploy-backend]
