      - name: Wait for deployment
        run: |
          echo "Waiting for discovery-agent deployment to complete..."
          sleep 30

      - name: Health check
        run: |
          DISC_URL="${{ secrets.RAILWAY_DISCOVERY_AGENT_URL }}"
          if [ -n "$DISC_URL" ]; then
            curl -f "${DISC_URL}/health" || echo "Health check failed - deployment may still be in progress"
          else
            echo "RAILWAY_DISCOVERY_AGENT_URL not set, skipping health check"
          fi

