name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, bugfixes/**]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd ai-brand-automator
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run linters
        run: |
          cd ai-brand-automator
          black --check .
          flake8 .
          pylint --load-plugins pylint_django --django-settings-module=brand_automator.settings */**.py || true
      
      - name: Run security scan
        run: |
          cd ai-brand-automator
          bandit -r . -ll || true
      
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_SSLMODE: disable
          DB_CHANNEL_BINDING: disable
          DEBUG: True
        run: |
          cd ai-brand-automator
          python manage.py migrate_schemas --shared --noinput
          pytest --cov=. --cov-report=xml --cov-report=html
      
      - name: Test MCP Server
        env:
          SECRET_KEY: test-secret-key-for-ci
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_SSLMODE: disable
          DB_CHANNEL_BINDING: disable
          DEBUG: True
        run: |
          cd ai-brand-automator
          python test_mcp_server.py --verbose
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./ai-brand-automator/coverage.xml
          flags: backend

  # Media Curation Tests
  test-media-curation:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev
      
      - name: Install dependencies
        run: |
          cd ai-brand-automator
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run media_curation tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_SSLMODE: disable
          DB_CHANNEL_BINDING: disable
          REDIS_URL: redis://localhost:6379/0
          DEBUG: True
        run: |
          cd ai-brand-automator
          python manage.py migrate_schemas --shared --noinput
          pytest media_curation/tests/ -v --cov=media_curation --cov-report=xml --cov-report=html
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./ai-brand-automator/coverage.xml
          flags: media-curation
  
  # Pipeline Orchestrator Tests
  orchestrator-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd pipeline-orchestrator-svc
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cd pipeline-orchestrator-svc
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./pipeline-orchestrator-svc/coverage.xml
          flags: orchestrator

  # Discovery Agent Tests
  discovery-agent-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd discovery-agent-svc
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cd discovery-agent-svc
          pytest tests/ -v -m "not integration" --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./discovery-agent-svc/coverage.xml
          flags: discovery-agent

  # Intelligence Agent Tests
  intelligence-agent-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd intelligence-agent-svc
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cd intelligence-agent-svc
          pytest tests/ -v -m "not integration" --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./intelligence-agent-svc/coverage.xml
          flags: intelligence-agent

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-brand-automator-frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd ai-brand-automator-frontend
          npm ci
      
      - name: Run linter
        run: |
          cd ai-brand-automator-frontend
          npm run lint
      
      - name: Run type check
        run: |
          cd ai-brand-automator-frontend
          npm run type-check || npx tsc --noEmit
      
      - name: Build
        run: |
          cd ai-brand-automator-frontend
          npm run build
      
      - name: Run tests
        run: |
          cd ai-brand-automator-frontend
          npm test -- --coverage || echo "No tests configured yet"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./ai-brand-automator-frontend/coverage/coverage-final.json
          flags: frontend
  
  # Build Docker Images
  build-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, test-media-curation, orchestrator-tests, discovery-agent-tests, intelligence-agent-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        run: |
          cd ai-brand-automator
          docker build -t ai-brand-automator-backend:${{ github.sha }} .
      
      - name: Build frontend image
        run: |
          cd ai-brand-automator-frontend
          docker build -t ai-brand-automator-frontend:${{ github.sha }} .
      
      - name: Build MCP server image
        run: |
          cd ai-brand-automator
          docker build -f Dockerfile.mcp -t ai-brand-automator-mcp:${{ github.sha }} .
      
      - name: Build curation consumer image
        run: |
          cd ai-brand-automator
          docker build -f Dockerfile.curation-consumer -t ai-brand-automator-curation:${{ github.sha }} .

      - name: Build orchestrator image
        run: |
          cd pipeline-orchestrator-svc
          docker build -t ai-brand-automator-orchestrator:${{ github.sha }} .

      - name: Build discovery agent image
        run: |
          cd discovery-agent-svc
          docker build -t ai-brand-automator-discovery:${{ github.sha }} .

      - name: Build intelligence agent image
        run: |
          cd intelligence-agent-svc
          docker build -t ai-brand-automator-intelligence:${{ github.sha }} .
